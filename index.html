<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistema de Tickets CELC</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: #fafafa;
      color: #111;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding: 24px;
    }

    .label {
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #999;
    }

    h1 {
      font-size: clamp(1.8rem, 5vw, 2.5rem);
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      color: #555;
      border: 1px solid #e2e2e2;
      border-radius: 999px;
      padding: 8px 16px;
      background: #fff;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #f5a623;
    }

    footer {
      position: absolute;
      bottom: 24px;
      font-size: 0.8rem;
      color: #aaa;
    }
  </style>
</head>
<body>
  <span class="label">Proyecto en desarrollo</span>
  <h1>Sistema de Tickets CELC</h1>
  <span class="status"><span class="dot"></span> En progreso</span>
  <footer>Próximamente</footer>
</body>
</html>
